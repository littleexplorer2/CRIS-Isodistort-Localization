# ============================================================
# ISOVIZ_INPUT 子项目配置
# 相对路径均相对本文件所在目录 config/ 解析。
# 虚拟环境与另外两个子项目共用仓库根 CRIS/.venv
# （由仓库根 setup_cris.py 创建或复用）。
# 本子项目不使用 output/：读完 CSV 与 .isoviz 后直接启动 IsoVIZ。
# ============================================================

paths:
  # 历史兼容输入目录（gitignore，不入库；默认不再从这里读振幅）
  input_root: "../input_content"
  data_dirname: "data.csv"
  structure_dirname: "subgroup.isoviz"
  # GD 写出的共享目录名
  best_model_folder_name: "Best_Model_Parameters"
  # 精确目录可由环境变量覆盖；用于三个同级目录迁移到其他磁盘。
  best_model_env_var: "BEST_MODEL_PARAMETERS_DIR"
  # 空字符串 = 依次查找环境变量、CRIS 同级目录、当前用户 Desktop。
  # 非空值表示 Best_Model_Parameters 的父目录。
  best_model_parent: ""

isoviz:
  # 优先读取这些环境变量指向的 .lnk / .exe / .jar
  env_vars:
    - ISOVIZ
    - ISOVIZ_JAR
  # 在下列目录中按顺序查找这些文件名
  launcher_names:
    - ISOViz.lnk
    - IsoVIZ.lnk
    - ISOVIZ.lnk
    - IsoViz.exe
    - ISOViz.exe
    - IsoViz.jar
    - ISOViz.jar
    - isoviz.jar
  # 查找目录：本子项目根，然后是 CRIS 仓库根（可放 ISOViz.lnk）
  launcher_search_dirs:
    - ".."
    - "../.."

runtime:
  python_min: "3.10"
