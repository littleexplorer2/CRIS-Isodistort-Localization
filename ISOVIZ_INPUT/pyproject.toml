[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isoviz-input"
version = "0.4.0"
description = "Desktop and CLI pipeline for validated amplitude input into IsoVIZ."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
isoviz-input = "isoviz_input.frontend.entrypoint:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "setuptools>=61.0",
    "wheel",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["isoviz_input*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "RUF", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR"]

[tool.ruff.lint.per-file-ignores]
"**/tests_dev/*.py" = ["S101"]
"main.py" = ["E402", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests_dev"]
pythonpath = ["."]
