# ============================================================
# ISODISTORT 本地化项目全局配置
# ============================================================

# ISOTROPY 套件二进制与数据库路径（isobyu 文件夹，只读，禁止修改）
# 注意：二进制为 Linux ELF 格式，Windows 下通过 WSL 调用；
#       封装层会自动在 WSL 侧建立短路径暂存目录与 ISODATA 符号链接，
#       因此无需手动修改这里的路径。
isobyu:
  # 二进制文件所在目录（相对 config/ 目录）
  bin_dir: "../isobyu"
  # 数据库文件所在目录（与二进制同目录）
  data_dir: "../isobyu"
  # 各可执行文件名
  iso_bin: "iso"
  findsym_bin: "findsym"
  smodes_bin: "smodes"   # 参数 k 点 IR 活性探测（Search 阶段过滤，只读）

# 计算默认参数
defaults:
  # 原子位置容差（分数坐标）
  position_tolerance: 0.001
  # 晶格容差
  lattice_tolerance: 0.00001
  # 默认畸变幅度（位移向量最大分量按该幅度缩放）
  default_amplitude: 1.0
  # 超胞大小 [a, b, c]（仅当未使用子群基矢时生效）
  default_supercell: [1, 1, 1]
  # 全局浮点比较容差 EPS（超空间对称判定、波矢约化、矩阵闭合；与 lattice_tolerance 相同）
  eps: 0.00001
  # (3+d) 超空间附加维度 nmod 上限（官网 “# of independent incommensurate modulations”，d = nmod）
  max_nmod: 3

# 运行时（网页与终端界面均为英语，不再提供中文切换）
# 网页/终端分工：Method 1–4 只调参数并计算结果表（可筛选、排序）；
# Distortion 统一下载筛选后的 txt/csv（1–4）以及 Method 1–3 的子群结构文件。
# Method 1 结果表列与官网序参量方向页（webpage_info 中 a. 开头的存档）字段一致：
# Irrep / OPD / Dir / SG / basis / origin / s / i / k-active（外加本地 idx）。
# Distortion ZIP 导出：文件名与文件夹对齐官网
# （subgroup.cif / data.isoviz / topas.str / Complete modes details.txt；
#  Method 1 文件夹用完整 OPD 行，Method 2/3 用「IR OPD」）。
# 勾选 isoviz/modes/topas 时会对非参数 k 点子群补跑 Method 2 填模式。
# 参数 k 点（LD 等）：nmod=0 时本地 iso 无法算位移模式（会提示）；nmod≥1 走 (3+d) 超空间内核。
# 仅 CIF 或 compute_modes=0（终端导出时选 no）可跳过补算。
# 网页空闲自动停服见 web_idle_timeout；长 ZIP 期间看门狗会把 in-flight 请求视为活跃。
runtime:
  # 网页端（web/server.py / main_web.py）监听端口
  web_port: 8000
  # 网页端空闲自动停服时间（秒）：页面关闭后心跳停止，超过该时长自动停服并释放端口
  web_idle_timeout: 60
  # 注：以下 relative 路径均相对于本文件所在目录 config/ 解析（config_loader 自动转换为绝对路径）。
  # Windows 侧临时文件目录（随后会被复制到 WSL 短路径暂存目录）
  temp_dir: "../output/tmp"
  # 输出目录（导出的 CIF / POSCAR / JSON 存放处）
  output_dir: "../output"
  # 子进程调用超时（秒）
  timeout: 60
  # 子群数据库在线生成超时（秒）
  # 对应 Method 2 勾选 “Generate isotropy subgroups database if missing”
  # （官网 “Generate isotropy subgroups”）：参数 k 点（如 LD/DT）的
  # data_*.txt 中若无子群列表，则由本机 iso 现场生成，可能耗时数分钟到
  # 数小时，故单独配置更长超时。结果缓存在 temp_dir，与 Distortion ZIP
  # 导出、以及已删除的 Distortion Generate（按幅度生成畸变结构）不是同一功能。
  generation_timeout: 3600
  # Method 2 的 nmod（# of independent incommensurate modulations）即超空间附加维度 d。
  # nmod=0：公度 3 维，走本地 iso；nmod≥1：走 isocore (3+d) 超空间内核（IT-C 标准取位）。
  # 上限见 defaults.max_nmod。网页端口仍为 runtime.web_port（默认 8000）。
