# ISODISTORT runtime configuration. Relative paths are resolved from config/.
# The three CRIS projects share the repository-root .venv.

isobyu:
  # Read-only Linux ISOTROPY binaries/data; Windows invokes them through WSL.
  bin_dir: "../isobyu"
  data_dir: "../isobyu"
  iso_bin: "iso"
  findsym_bin: "findsym"
  smodes_bin: "smodes"

defaults:
  # Experimental-structure symmetry recognition: Cartesian Å and degrees.
  symmetry_cartesian_tolerance_angstrom: 0.001
  symmetry_angle_tolerance_degrees: 5.0
  # Exact affine probes only cross a float boundary at spglib; this Å tolerance
  # is tightened further at runtime only as required by machine precision.
  affine_exact_cartesian_tolerance_angstrom: 0.0000001
  # Dimensionless rational-recovery and lattice/matrix residuals.
  fractional_coordinate_tolerance: 0.0000001
  lattice_tolerance: 0.00001
  default_amplitude: 1.0
  default_supercell: [1, 1, 1]
  eps: 0.00001

runtime:
  web_port: 8000
  # Crash/lost-heartbeat fallback; normal last-tab close exits sooner.
  web_idle_timeout: 60
  temp_dir: "../output/tmp"
  output_dir: "../output"
  timeout: 60
  # On-demand parametric-k subgroup database generation can be long-running.
  generation_timeout: 3600
  # Method 3 budgets. Zero means unlimited; overflow fails rather than truncates.
  method3_max_parametric_values: 0
  method3_max_backend_queries: 0
