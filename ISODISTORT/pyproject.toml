[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isodistort"
version = "0.3.0"
description = "ISODISTORT: offline crystal distortion analysis based on ISOTROPY suite (Method 1 table matches official OPD fields; (3+d) superspace kernel nmod=d)"
authors = [{ name = "CRIS" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pymatgen>=2023.1.1",
    "pyyaml>=6.0",
    "spglib>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["isodistort*", "isocore*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "RUF", "PL"]
# 中文代码库：全角标点在中文文案中是刻意用法，不做歧义告警；
# PLR*（重构建议，如魔法数字/参数过多）对本项目过于教条，忽略
ignore = ["RUF001", "RUF002", "RUF003", "PLR"]
# 说明：BLE001 盲捕异常在 CLI 边界（main_terminal.py）与少数兼容场景按需放行（带 noqa）

[tool.ruff.lint.per-file-ignores]
# 测试文件使用 assert 断言属正常用法（开发者端 tests_dev/ 目录）
"**/tests_dev/*.py" = ["S101"]

[tool.ruff.lint.isort]
# 本仓库包名（isocore/isodistort/web）为 first-party，保证导入排序一致
known-first-party = ["isocore", "isodistort", "web"]

[tool.pytest.ini_options]
testpaths = ["tests_dev"]
