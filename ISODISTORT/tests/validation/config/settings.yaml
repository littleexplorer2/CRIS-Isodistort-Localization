# ============================================================
# ISODISTORT 测试比较配置
# 相对路径均相对本文件所在目录 config/ 解析。
# 使用仓库根 CRIS/.venv
# （由仓库根 setup_cris.py 创建或复用）。
# ============================================================

# 未显式传入文件/目录时使用的比较路径；工具只读，不创建目录。
compare:
  # 比较根目录
  root: "../../../output/validation/compare"
  # 待验证：本地 ISODISTORT 导出的 CIF
  item_dir: "item"
  # 参考：只读 CIF；按与 item/ 相同的相对路径配对，不修改原件。
  true_dir: "true"
  # 递归匹配模式
  pattern: "*.cif"

# 语义比较默认容差（命令行未覆盖时使用）
defaults:
  lattice_tolerance: 0.00001
  coordinate_tolerance: 0.00001
  scalar_tolerance: 0.00001
  # 是否忽略 CIF 原子行顺序（按元素+分数坐标配对）
  ignore_atom_order: false
  # 是否额外要求字节完全一致才 PASS（排版调试用）
  strict: false
