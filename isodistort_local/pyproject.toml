[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-isodistort"
version = "0.1.0"
description = "Localized ISODISTORT: offline crystal distortion analysis based on ISOTROPY suite"
authors = [{ name = "CRIS Lab" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pymatgen>=2023.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.3",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.9",
    "pre-commit>=3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["local_isodistort*"]
