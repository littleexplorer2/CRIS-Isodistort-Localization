[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-isodistort"
version = "0.1.0"
description = "Localized ISODISTORT: offline crystal distortion analysis based on ISOTROPY suite"
authors = [{ name = "CRIS Lab" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pymatgen>=2023.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vis = ["pyvista>=0.38"]
dev = ["pytest>=7.0"]

[project.scripts]
isodistort = "local_isodistort.api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_isodistort*"]
