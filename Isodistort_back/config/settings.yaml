# ============================================================
# ISODISTORT 全局配置
# ============================================================

# ISOTROPY 套件二进制与数据库路径（isobyu 文件夹，只读不可修改）
isobyu:
  # 二进制文件所在目录
  bin_dir: "../isobyu"
  # 数据库文件所在目录（与二进制同目录）
  data_dir: "../isobyu"
  # 各可执行文件名
  iso_bin: "iso"
  findsym_bin: "findsym"
  findsym_cifinput_bin: "findsym_cifinput"
  smodes_bin: "smodes"
  comsubs_bin: "comsubs"

# 计算默认参数
defaults:
  # 原子位置容差（分数坐标）
  position_tolerance: 0.001
  # 晶格容差
  lattice_tolerance: 0.00001
  # 默认畸变幅度
  default_amplitude: 1.0
  # 超胞大小 [a, b, c]
  default_supercell: [1, 1, 1]

# 运行时
runtime:
  # 临时文件目录
  temp_dir: "../output/tmp"
  # 输出目录
  output_dir: "../output"
  # 子进程调用超时（秒）
  timeout: 60
